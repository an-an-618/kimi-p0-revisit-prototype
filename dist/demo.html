<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f8">
  <title>Kimi P0 · 主流程演示</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #202020; background: #f7f7f8; }
    main { max-width: 1100px; padding: 40px 24px 48px; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
    .brand { font-size: 26px; font-weight: 650; letter-spacing: -1px; }
    .brand span { font-size: 12px; font-weight: 400; color: #999; letter-spacing: 0; margin-left: 12px; }
    a { color: inherit; text-decoration: none; }
    .enter { background: #202020; color: white; padding: 11px 16px; border-radius: 9px; font-size: 13px; white-space: nowrap; }
    .enter:hover { background: #444; }
    h1 { font-size: 28px; font-weight: 550; line-height: 1.5; margin: 0 0 12px; }
    .lead { color: #888; font-size: 14px; line-height: 1.8; margin-bottom: 24px; }
    video { display: block; width: 100%; aspect-ratio: 8/5; background: #202020; border: 1px solid #e9e9eb; border-radius: 14px; }
    .caption { display: flex; justify-content: space-between; gap: 16px; margin-top: 16px; color: #999; font-size: 12px; line-height: 1.8; }
    .caption a { color: #666; white-space: nowrap; text-decoration: underline; text-underline-offset: 4px; }
    .play { font: inherit; font-size: 12px; cursor: pointer; background: white; color: #555; border: 1px solid #ddd; border-radius: 7px; padding: 7px 12px; margin-top: 12px; }
    footer { padding-top: 28px; margin-top: 30px; border-top: 1px solid #e4e4e7; font-size: 12px; line-height: 1.9; color: #999; }
    footer a { text-decoration: underline; text-underline-offset: 4px; }
    :focus-visible { outline: 2px solid #6986b2; outline-offset: 4px; }
    @media (max-width: 600px) {
      main { padding: 24px 16px; }
      header { margin-bottom: 30px; gap: 10px; }
      .brand { font-size: 23px; }
      .brand span { display: block; margin: 5px 0 0; font-size: 10px; }
      .enter { padding: 10px 12px; font-size: 12px; }
      h1 { font-size: 22px; }
      .lead { font-size: 12px; }
      video { border-radius: 10px; }
      .caption { flex-direction: column; gap: 8px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="./">Kimi<span>P0 交互原型</span></a>
      <a class="enter" href="./">进入可交互原型 ↗</a>
    </header>
    <h1>接着上次，还可以这样做</h1>
    <p class="lead">一次基础阅读，如何变成回访时值得继续的任务？这段录屏展示完整的两次访问与材料对比任务。</p>
    <video controls playsinline preload="metadata" aria-label="68 秒主流程演示录屏">
      <source src="demo/main-flow.mp4" type="video/mp4">
      当前浏览器不支持内嵌播放，请下载下方 MP4。
    </video>
    <button class="play" id="play-button" type="button">播放录屏</button>
    <div class="caption">
      <span>首次请求与摘要 → 模拟第二天 → 历史建议与来源 → 核对材料 → 研究对比表</span>
      <a href="demo/main-flow.mp4" download>下载 68 秒 MP4</a>
    </div>
    <footer>
      这是产品经理笔试的 P0 原型，材料均为合成素材，输出使用本地规则与模板；没有调用真实 Kimi 模型或接入会员交易。<br>
      <a href="https://github.com/an-an-618/kimi-p0-revisit-prototype" target="_blank" rel="noopener noreferrer">在 GitHub 查看源码、截图和验证记录</a>
    </footer>
  </main>
  <script>
    const video = document.querySelector('video');
    const button = document.querySelector('#play-button');
    button.addEventListener('click', async () => {
      if (video.paused) {
        try { await video.play(); }
        catch { button.textContent = '播放失败，请下载 MP4'; }
      } else video.pause();
    });
    video.addEventListener('play', () => { button.textContent = '暂停录屏'; });
    video.addEventListener('pause', () => { button.textContent = video.ended ? '重新播放' : '播放录屏'; });
  </script>
</body>
</html>
